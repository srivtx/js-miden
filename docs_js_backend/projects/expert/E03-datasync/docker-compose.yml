version: '3.8'

services:
  sync:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - WS_PORT=3001
      - STORAGE_TYPE=postgres
    depends_on:
      - postgres
      - redis

  presence:
    build:
      context: .
      dockerfile: Dockerfile.presence
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis

  storage:
    build:
      context: .
      dockerfile: Dockerfile.storage
    ports:
      - "3003:3003"
    environment:
      - PORT=3003
      - DATABASE_URL=postgresql://user:pass@postgres:5432/datasync
    depends_on:
      - postgres

  conflict:
    build:
      context: .
      dockerfile: Dockerfile.conflict
    ports:
      - "3004:3004"
    environment:
      - PORT=3004
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=pass
      - POSTGRES_DB=datasync
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data: