version: "3.9"

services:
  user-service:
    build:
      context: ./user-service
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - JWT_SECRET=${JWT_SECRET:-super-secret}
    networks:
      - e05-network

  post-service:
    build:
      context: ./post-service
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
      - JWT_SECRET=${JWT_SECRET:-super-secret}
    networks:
      - e05-network

  feed-service:
    build:
      context: ./feed-service
    ports:
      - "3003:3003"
    environment:
      - PORT=3003
      - JWT_SECRET=${JWT_SECRET:-super-secret}
    networks:
      - e05-network

  notification-service:
    build:
      context: ./notification-service
    ports:
      - "3004:3004"
    environment:
      - PORT=3004
      - JWT_SECRET=${JWT_SECRET:-super-secret}
    networks:
      - e05-network

  message-service:
    build:
      context: ./message-service
    ports:
      - "3005:3005"
    environment:
      - PORT=3005
      - JWT_SECRET=${JWT_SECRET:-super-secret}
    networks:
      - e05-network

  search-service:
    build:
      context: ./search-service
    ports:
      - "3006:3006"
    environment:
      - PORT=3006
      - JWT_SECRET=${JWT_SECRET:-super-secret}
    networks:
      - e05-network

  recommendation-service:
    build:
      context: ./recommendation-service
    ports:
      - "3007:3007"
    environment:
      - PORT=3007
      - JWT_SECRET=${JWT_SECRET:-super-secret}
    networks:
      - e05-network

  media-service:
    build:
      context: ./media-service
    ports:
      - "3008:3008"
    environment:
      - PORT=3008
      - JWT_SECRET=${JWT_SECRET:-super-secret}
    networks:
      - e05-network

  moderation-service:
    build:
      context: ./moderation-service
    ports:
      - "3009:3009"
    environment:
      - PORT=3009
      - JWT_SECRET=${JWT_SECRET:-super-secret}
    networks:
      - e05-network

  ad-service:
    build:
      context: ./ad-service
    ports:
      - "3010:3010"
    environment:
      - PORT=3010
      - JWT_SECRET=${JWT_SECRET:-super-secret}
    networks:
      - e05-network

networks:
  e05-network:
    driver: bridge
