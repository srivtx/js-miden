version: "3.9"

services:
  upload-service:
    build:
      context: ./upload-service
    ports:
      - "4001:4001"
    environment:
      - PORT=4001
      - JWT_SECRET=${JWT_SECRET:-super-secret}
    networks:
      - e06-network

  transcode-service:
    build:
      context: ./transcode-service
    ports:
      - "4002:4002"
    environment:
      - PORT=4002
      - JWT_SECRET=${JWT_SECRET:-super-secret}
    networks:
      - e06-network

  stream-service:
    build:
      context: ./stream-service
    ports:
      - "4003:4003"
    environment:
      - PORT=4003
      - JWT_SECRET=${JWT_SECRET:-super-secret}
    networks:
      - e06-network

  recommendation-service:
    build:
      context: ./recommendation-service
    ports:
      - "4004:4004"
    environment:
      - PORT=4004
      - JWT_SECRET=${JWT_SECRET:-super-secret}
    networks:
      - e06-network

  user-service:
    build:
      context: ./user-service
    ports:
      - "4005:4005"
    environment:
      - PORT=4005
      - JWT_SECRET=${JWT_SECRET:-super-secret}
    networks:
      - e06-network

  search-service:
    build:
      context: ./search-service
    ports:
      - "4006:4006"
    environment:
      - PORT=4006
      - JWT_SECRET=${JWT_SECRET:-super-secret}
    networks:
      - e06-network

  subscription-service:
    build:
      context: ./subscription-service
    ports:
      - "4007:4007"
    environment:
      - PORT=4007
      - JWT_SECRET=${JWT_SECRET:-super-secret}
    networks:
      - e06-network

  analytics-service:
    build:
      context: ./analytics-service
    ports:
      - "4008:4008"
    environment:
      - PORT=4008
      - JWT_SECRET=${JWT_SECRET:-super-secret}
    networks:
      - e06-network

networks:
  e06-network:
    driver: bridge
