services:
  api:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "3005:3000"
    command: sh -c "npm install && npm run dev"
    environment:
      - NODE_ENV=development
    depends_on:
      - redis
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
