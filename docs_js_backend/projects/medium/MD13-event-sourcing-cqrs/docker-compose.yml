services:
  postgres:
    image: postgres:16-alpine
    container_name: md13-postgres
    environment:
      POSTGRES_USER: cqrs
      POSTGRES_PASSWORD: cqrs_secret
      POSTGRES_DB: cqrs_db
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cqrs -d cqrs_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: md13-app
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://cqrs:cqrs_secret@postgres:5432/cqrs_db
      PORT: 3001
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: