version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: md24-postgres
    environment:
      POSTGRES_USER: hr
      POSTGRES_PASSWORD: hr123
      POSTGRES_DB: hr_management
    ports:
      - "54324:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hr -d hr_management"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
