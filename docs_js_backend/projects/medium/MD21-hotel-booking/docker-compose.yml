version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: md21-postgres
    environment:
      POSTGRES_USER: hotel
      POSTGRES_PASSWORD: hotel123
      POSTGRES_DB: hotel_booking
    ports:
      - "54321:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotel -d hotel_booking"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: md21-redis
    ports:
      - "63791:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
