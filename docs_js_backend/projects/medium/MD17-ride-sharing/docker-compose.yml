version: '3.8'

services:
  app:
    build: .
    container_name: md17-ride-sharing
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/ride_sharing?schema=public
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production
      - PORT=3001
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - db
      - redis
    command: sh -c "npx prisma migrate dev && npm run dev"

  db:
    image: postgres:16-alpine
    container_name: md17-db
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=ride_sharing
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: md17-redis
    ports:
      - "6380:6379"

  test:
    build: .
    container_name: md17-test
    environment:
      - NODE_ENV=test
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/ride_sharing_test?schema=public
      - JWT_SECRET=test-secret
    depends_on:
      - db
    command: npm test
    profiles:
      - test

volumes:
  postgres_data:
