version: '3.8'

services:
  app:
    build: .
    container_name: md20-logistics
    ports:
      - "3004:3004"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/logistics?schema=public
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production
      - PORT=3004
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - db
      - redis
    command: sh -c "npx prisma migrate dev && npm run dev"

  db:
    image: postgres:16-alpine
    container_name: md20-db
    ports:
      - "5436:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=logistics
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: md20-redis
    ports:
      - "6381:6379"

  test:
    build: .
    container_name: md20-test
    environment:
      - NODE_ENV=test
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/logistics_test?schema=public
      - JWT_SECRET=test-secret
    depends_on:
      - db
    command: npm test
    profiles:
      - test

volumes:
  postgres_data:
