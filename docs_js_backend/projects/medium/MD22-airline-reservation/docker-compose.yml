version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: md22-postgres
    environment:
      POSTGRES_USER: airline
      POSTGRES_PASSWORD: airline123
      POSTGRES_DB: airline_reservation
    ports:
      - "54322:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airline -d airline_reservation"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
