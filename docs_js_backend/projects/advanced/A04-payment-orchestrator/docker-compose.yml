version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: a04-payment-orchestrator
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - LOG_LEVEL=info
      - STRIPE_WEBHOOK_SECRET=whsec_test
      - PAYPAL_WEBHOOK_SECRET=whsec_paypal_test
    volumes:
      - payment-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  payment-data:
