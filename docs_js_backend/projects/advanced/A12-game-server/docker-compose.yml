version: '3.8'

services:
  matchmaking-service:
    build: .
    ports:
      - "3021:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/gameserver
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=change-me-in-production
    depends_on:
      - postgres
      - redis

  game-state-service:
    build: .
    ports:
      - "3022:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/gameserver
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=change-me-in-production
    depends_on:
      - postgres
      - redis

  leaderboard-service:
    build: .
    ports:
      - "3023:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/gameserver
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=change-me-in-production
    depends_on:
      - postgres
      - redis

  anti-cheat-service:
    build: .
    ports:
      - "3024:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/gameserver
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=change-me-in-production
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=gameserver
    ports:
      - "5421:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6321:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
