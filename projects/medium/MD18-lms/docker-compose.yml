version: '3.8'

services:
  app:
    build: .
    container_name: md18-lms
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/lms?schema=public
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production
      - PORT=3002
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - db
    command: sh -c "npx prisma migrate dev && npm run dev"

  db:
    image: postgres:16-alpine
    container_name: md18-db
    ports:
      - "5434:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=lms
    volumes:
      - postgres_data:/var/lib/postgresql/data

  test:
    build: .
    container_name: md18-test
    environment:
      - NODE_ENV=test
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/lms_test?schema=public
      - JWT_SECRET=test-secret
    depends_on:
      - db
    command: npm test
    profiles:
      - test

volumes:
  postgres_data:
